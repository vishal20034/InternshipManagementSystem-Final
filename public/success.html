<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — Registration Successful</title>
<link rel="stylesheet" href="ten-theme.css">
<link rel="stylesheet" href="ten-motion.css">
<style>

html, body {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.success-wrap {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 24px;
  animation: ten-fadeUp 0.5s ease both;
}

.success-card {
  background: var(--ten-card);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-xl);
  padding: 60px 72px;
  box-shadow: var(--ten-shadow-lg), var(--ten-glow-gold);
  position: relative;
  overflow: hidden;
  max-width: 520px;
}
.success-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ten-gold), transparent);
}

.success-icon {
  width: 80px; height: 80px;
  background: var(--ten-gold-bg);
  border: 1px solid var(--ten-border-strong);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin-bottom: 24px;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  animation-delay: 0.2s;
}
@keyframes pop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

h1 {
  font-family: var(--ten-font-display);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ten-text);
  margin-bottom: 12px;
}

.success-sub {
  font-size: 14px;
  color: var(--ten-text-sub);
  line-height: 1.75;
  margin-bottom: 32px;
}

.brand-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--ten-gold-bg);
  border: 1px solid var(--ten-border);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--ten-gold);
  text-transform: uppercase;
  margin-bottom: 24px;
}

/* Progress bar */
.progress-wrap {
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--ten-gold), var(--ten-gold-light));
  border-radius: 3px;
  animation: fill-bar 1.5s linear forwards;
}
@keyframes fill-bar {
  from { width: 0%; }
  to   { width: 100%; }
}

.redirect-note {
  margin-top: 16px;
  font-size: 12px;
  color: var(--ten-text-muted);
  font-family: var(--ten-font-mono);
  letter-spacing: 0.5px;
}

</style>
</head>
<body>

<div class="ten-grid-bg"></div>
<div class="ten-orb ten-orb-1"></div>
<div class="ten-orb ten-orb-2"></div>

<div class="success-wrap">
  <div class="success-card ten-scale-in">

    <div class="brand-tag">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
        <path d="M1 5C1 3.34 2.34 2 4 2C5.66 2 7 3.34 7 5C7 6.66 5.66 8 4 8C2.34 8 1 6.66 1 5Z" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
        <path d="M7 5C7 3.34 8.34 2 10 2C11.66 2 13 3.34 13 5C13 6.66 11.66 8 10 8C8.34 8 7 6.66 7 5Z" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
      </svg>
      TEN
    </div>

    <div class="success-icon ten-glow-pulse">✓</div>

    <h1>Registration Successful!</h1>

    <p class="success-sub">
      Welcome to TEN Internship Portal.<br>
      Check your email for your <strong style="color: var(--ten-gold);">Employee ID & Password</strong>.
    </p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="redirect-note">Redirecting to your domain groups...</div>

  </div>
</div>

<script>
setTimeout(() => {
  const redirect = sessionStorage.getItem("redirectAfterSuccess") || "groups.html";
  sessionStorage.removeItem("redirectAfterSuccess");
  window.location.href = redirect;
}, 1500);
(function confetti(){
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;
      width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;
      background:hsl(${Math.random()*60+30},80%,60%);border-radius:${Math.random()>0.5?'50%':'2px'};
      animation:ten-particleRise ${2+Math.random()*3}s ${Math.random()*2}s linear forwards;
      transform:rotate(${Math.random()*360}deg);z-index:9999;pointer-events:none;`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),6000);
  }
})();
</script>

<script src="ten-motion.js"></script>
</body>
</html>
