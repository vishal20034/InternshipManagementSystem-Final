<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Directory — TEN Portal</title>
<link rel="stylesheet" href="ten-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#05070e;--bg-surface:#090d1a;--bg-card:#0e1428;--border:rgba(212,175,55,0.08);--border-strong:rgba(212,175,55,0.18);--accent-gold:#D4AF37;--text-primary:#F0EEE8;--text-secondary:#9a9080;--accent-blue:#3b82f6;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:24px;}
.top-bar{display:flex;align-items:center;gap:16px;margin-bottom:32px;}
.back-btn{background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-primary);padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none;transition:.2s;}
.back-btn:hover{border-color:var(--accent-gold);color:var(--accent-gold);}
.hero{text-align:center;padding:48px 24px 40px;}
.hero-badge{display:inline-block;padding:6px 16px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:20px;font-size:13px;color:var(--accent-blue);margin-bottom:16px;}
.hero h1{font-size:40px;font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#F0EEE8,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:var(--text-secondary);font-size:16px;max-width:560px;margin:0 auto 24px;}
.search-bar{max-width:500px;margin:0 auto;display:flex;gap:12px;}
.search-bar input{flex:1;background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-primary);padding:13px 18px;border-radius:12px;font-size:14px;outline:none;}
.search-bar input:focus{border-color:var(--accent-blue);}
.search-bar button{padding:13px 22px;background:var(--accent-blue);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;}
.stage-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0;}
.chip{padding:7px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:.2s;}
.chip.active,.chip:hover{border-color:var(--accent-blue);color:var(--accent-blue);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;max-width:1200px;margin:0 auto;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:24px;transition:.3s;}
.card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.3);}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;}
.name{font-size:17px;font-weight:700;}
.firm{font-size:13px;color:var(--accent-blue);}
.type{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.thesis{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.1);border-radius:10px;padding:12px;margin-bottom:14px;}
.thesis-label{font-size:11px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.thesis-text{font-size:13px;color:var(--text-primary);}
.focus{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.focus-tag{padding:3px 10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);border-radius:12px;font-size:11px;color:#3b82f6;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-box{background:rgba(255,255,255,.03);border-radius:8px;padding:8px;text-align:center;}
.stat-val{font-size:16px;font-weight:700;color:var(--accent-gold);}
.stat-label{font-size:10px;color:var(--text-secondary);}
.pitch-btn{width:100%;padding:10px;background:var(--accent-blue);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.pitch-btn:hover{opacity:.85;}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" class="back-btn">← Home</a>
</div>
<div class="hero">
  <div class="hero-badge">💼 Investor Network</div>
  <h1>Investor Directory</h1>
  <p>Connect with angel investors, VCs, and family offices actively investing in early-stage startups from TEN's ecosystem.</p>
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Search investors, firms, or sectors...">
    <button onclick="search()">Search</button>
  </div>
</div>

<div class="stage-filters">
  <div class="chip active" onclick="filter('all',this)">All Stages</div>
  <div class="chip" onclick="filter('angel',this)">Angel</div>
  <div class="chip" onclick="filter('pre-seed',this)">Pre-Seed</div>
  <div class="chip" onclick="filter('seed',this)">Seed</div>
  <div class="chip" onclick="filter('series-a',this)">Series A+</div>
</div>

<div class="grid" id="grid"></div>

<script>
const INVESTORS = [
  {name:'Vikram Patel',firm:'Spark Ventures',avatar:'VP',type:'Angel Investor',stage:'angel',cat:'angel',desc:'Serial entrepreneur turned angel. 60+ investments. Focused on B2B SaaS and deep tech.',thesis:'Backing founders who are 10x more obsessed with the problem than the solution.',focus:['B2B SaaS','Deep Tech','AI','FinTech'],portfolio:60,avgTicket:'₹25L',exits:8},
  {name:'Nandita Krishnan',firm:'Matrix Partners India',avatar:'NK',type:'Partner',stage:'Series A',cat:'series-a',desc:'Consumer tech and marketplace specialist. Led investments in 3 unicorns.',thesis:'Consumer internet at the next billion users opportunity.',focus:['Consumer Tech','Marketplace','D2C','HealthTech'],portfolio:34,avgTicket:'$3M',exits:12},
  {name:'Rohit Agarwal',firm:'100X.VC',avatar:'RA',type:'Managing Director',stage:'Pre-Seed',cat:'pre-seed',desc:'India-focused pre-seed fund. Invested in 100+ companies annually.',thesis:'India-first founders solving real Indian problems.',focus:['All Sectors','India-First','Pre-PMF'],portfolio:200,avgTicket:'₹50L',exits:22},
  {name:'Sheetal Bhatia',firm:'Accel Partners',avatar:'SB',type:'Principal',stage:'Seed/Series A',cat:'seed',desc:'Enterprise SaaS and developer tools expert. Stanford MBA.',thesis:'Global SaaS from India — $1B+ ARR potential.',focus:['Enterprise SaaS','Dev Tools','Infra','Security'],portfolio:28,avgTicket:'$2M',exits:6},
  {name:'Anand Jha',firm:'Blume Ventures',avatar:'AJ',type:'Partner',stage:'Seed',cat:'seed',desc:'Deep tech and climate investor. IIT Bombay. Author of Indian startup ecosystem reports.',thesis:'Climate tech and deep science startups solving existential problems.',focus:['CleanTech','DeepTech','Space','BioTech'],portfolio:45,avgTicket:'₹2Cr',exits:9},
  {name:'Preethi Nair',firm:'Stellaris Venture Partners',avatar:'PN',type:'General Partner',stage:'Seed/Series A',cat:'seed',desc:'B2B and FinTech focus. Ex-WhatsApp. Backed multiple unicorns early.',thesis:'Technology-first businesses with strong network effects.',focus:['FinTech','B2B','APIs','Payments'],portfolio:32,avgTicket:'$1.5M',exits:7},
];

let allInvestors = [...INVESTORS];
let activeCat = 'all';

function render(investors) {
  document.getElementById('grid').innerHTML = investors.map(i => `
    <div class="card">
      <div class="card-top">
        <div class="avatar">${i.avatar}</div>
        <div><div class="name">${i.name}</div><div class="firm">${i.firm}</div><div class="type">${i.type} · ${i.stage}</div></div>
      </div>
      <div class="desc">${i.desc}</div>
      <div class="thesis"><div class="thesis-label">Investment Thesis</div><div class="thesis-text">"${i.thesis}"</div></div>
      <div class="focus">${i.focus.map(f=>`<span class="focus-tag">${f}</span>`).join('')}</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val">${i.portfolio}+</div><div class="stat-label">Portfolio</div></div>
        <div class="stat-box"><div class="stat-val">${i.avgTicket}</div><div class="stat-label">Avg Ticket</div></div>
        <div class="stat-box"><div class="stat-val">${i.exits}</div><div class="stat-label">Exits</div></div>
      </div>
      <button class="pitch-btn" onclick="pitch('${i.name}')">Send Pitch Deck</button>
    </div>`).join('');
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allInvestors.filter(i =>
    i.name.toLowerCase().includes(q) || i.firm.toLowerCase().includes(q) ||
    i.focus.some(f => f.toLowerCase().includes(q)) || i.desc.toLowerCase().includes(q)
  );
  render(activeCat === 'all' ? filtered : filtered.filter(i => i.cat === activeCat));
}

function filter(cat, el) {
  activeCat = cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render(cat === 'all' ? allInvestors : allInvestors.filter(i => i.cat === cat));
}

function pitch(name) {
  alert('Pitch submission coming soon! ' + name + ' will review your pitch deck shortly.');
}

document.getElementById('searchInput').addEventListener('keyup', e => { if(e.key==='Enter') search(); });
render(allInvestors);
</script>
</body>
</html>
