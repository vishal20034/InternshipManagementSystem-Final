<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Internships — TEN Portal</title>
<link rel="stylesheet" href="ten-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
  --bg-base: #05070e; --bg-surface: #090d1a; --bg-card: #0e1428;
  --border: rgba(212,175,55,0.08); --border-strong: rgba(212,175,55,0.18);
  --accent-gold: #D4AF37; --text-primary: #F0EEE8; --text-secondary: #9a9080;
  --accent-green: #10b981; --accent-amber: #f59e0b; --accent-red: #ef4444; --accent-blue: #3b82f6;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-base); color:var(--text-primary); font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; padding:24px; }
.top-bar { display:flex; align-items:center; gap:16px; margin-bottom:32px; }
.back-btn { background:var(--bg-card); border:1px solid var(--border-strong); color:var(--text-primary); padding:10px 20px; border-radius:10px; cursor:pointer; font-size:14px; text-decoration:none; transition:.2s; }
.back-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }
h1 { font-size:28px; font-weight:800; color:var(--accent-gold); }
.subtitle { color:var(--text-secondary); font-size:15px; margin-top:4px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; margin-top:24px; }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:24px; transition:.2s; }
.card:hover { border-color:var(--border-strong); transform:translateY(-2px); }
.card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.card-title { font-size:18px; font-weight:700; }
.badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; text-transform:uppercase; }
.badge.active { background:rgba(16,185,129,.15); color:#10b981; }
.badge.completed { background:rgba(59,130,246,.15); color:#3b82f6; }
.badge.pending { background:rgba(245,158,11,.15); color:#f59e0b; }
.badge.rejected { background:rgba(239,68,68,.15); color:#ef4444; }
.card-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.meta-item { background:rgba(255,255,255,.03); border-radius:8px; padding:10px; }
.meta-label { font-size:11px; color:var(--text-secondary); margin-bottom:2px; text-transform:uppercase; letter-spacing:.5px; }
.meta-value { font-size:14px; font-weight:600; }
.view-btn { width:100%; padding:10px; background:linear-gradient(135deg,var(--accent-gold),#b8962e); color:#05070e; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; transition:.2s; }
.view-btn:hover { opacity:.9; transform:translateY(-1px); }
.empty-state { text-align:center; padding:80px 24px; }
.empty-icon { font-size:64px; margin-bottom:16px; }
.empty-title { font-size:22px; font-weight:700; margin-bottom:8px; }
.empty-desc { color:var(--text-secondary); margin-bottom:24px; }
.browse-btn { display:inline-block; padding:12px 28px; background:var(--accent-gold); color:#05070e; border-radius:10px; font-weight:700; text-decoration:none; transition:.2s; }
.browse-btn:hover { opacity:.9; }
.skeleton { animation:pulse 1.5s ease-in-out infinite; background:linear-gradient(90deg,var(--bg-card) 25%,rgba(255,255,255,.05) 50%,var(--bg-card) 75%); background-size:200% 100%; border-radius:16px; height:220px; }
@keyframes pulse { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
</style>
</head>
<body>
<div class="top-bar">
  <a href="student-dashboard.html" class="back-btn">← Back to Dashboard</a>
  <div>
    <h1>📋 My Internships</h1>
    <div class="subtitle">Track your internship journey</div>
  </div>
</div>

<div id="content">
  <div class="grid" id="skeletonGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<script>
const EMP_ID = localStorage.getItem('employeeId') || sessionStorage.getItem('employeeId') || new URLSearchParams(location.search).get('empId');

const STATUS_LABELS = {
  active: 'Active', completed: 'Completed', pending: 'Pending Approval',
  rejected: 'Rejected', approved: 'Approved'
};

async function loadInternships() {
  try {
    if (!EMP_ID) {
      document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">Login Required</div><div class="empty-desc">Please log in to view your internships.</div><a href="/login" class="browse-btn">Go to Login</a></div>`;
      return;
    }

    const res = await fetch('/students?empId=' + EMP_ID);
    const data = await res.json();

    const students = Array.isArray(data) ? data : (data.students || []);
    const me = students.find(s => s.employeeId === EMP_ID);

    if (!me) {
      document.getElementById('content').innerHTML = renderEmpty();
      return;
    }

    const internships = [];
    internships.push({
      title: me.domain + ' Internship',
      company: 'The Entrepreneurship Network',
      domain: me.domain,
      tenure: me.tenure,
      startDate: me.joiningDate ? new Date(me.joiningDate).toLocaleDateString('en-IN') : 'N/A',
      stipend: 'Certificate on Completion',
      status: me.certificateApprovedByHR ? 'completed' : (me.certificateApprovedByCoordinator ? 'active' : 'active'),
      employeeId: me.employeeId
    });

    if (me.linkedDomains && me.linkedDomains.length > 0) {
      me.linkedDomains.forEach(d => {
        if (d.domain !== me.domain) {
          internships.push({
            title: d.domain + ' Internship',
            company: 'The Entrepreneurship Network',
            domain: d.domain,
            tenure: me.tenure,
            startDate: me.joiningDate ? new Date(me.joiningDate).toLocaleDateString('en-IN') : 'N/A',
            stipend: 'Certificate on Completion',
            status: 'active',
            employeeId: d.employeeId
          });
        }
      });
    }

    renderCards(internships);
  } catch (err) {
    console.error(err);
    document.getElementById('content').innerHTML = renderEmpty();
  }
}

function renderCards(internships) {
  if (!internships.length) {
    document.getElementById('content').innerHTML = renderEmpty();
    return;
  }
  const html = `<div class="grid">${internships.map(i => `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${i.title}</div>
        <span class="badge ${i.status}">${STATUS_LABELS[i.status] || i.status}</span>
      </div>
      <div class="card-meta">
        <div class="meta-item"><div class="meta-label">Company</div><div class="meta-value">${i.company}</div></div>
        <div class="meta-item"><div class="meta-label">Domain</div><div class="meta-value">${i.domain}</div></div>
        <div class="meta-item"><div class="meta-label">Duration</div><div class="meta-value">${i.tenure || 'N/A'}</div></div>
        <div class="meta-item"><div class="meta-label">Start Date</div><div class="meta-value">${i.startDate}</div></div>
        <div class="meta-item"><div class="meta-label">Stipend</div><div class="meta-value" style="font-size:12px">${i.stipend}</div></div>
        <div class="meta-item"><div class="meta-label">Employee ID</div><div class="meta-value">${i.employeeId}</div></div>
      </div>
      <button class="view-btn" onclick="viewDetails('${i.employeeId}')">View Full Details →</button>
    </div>`).join('')}</div>`;
  document.getElementById('content').innerHTML = html;
}

function renderEmpty() {
  return `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No Internships Yet</div><div class="empty-desc">You haven't registered for any internship program yet.<br>Browse our programs to get started.</div><a href="/programs" class="browse-btn">Browse Programs</a></div>`;
}

function viewDetails(empId) {
  window.location.href = 'student-dashboard.html?empId=' + empId;
}

loadInternships();
</script>
</body>
</html>
