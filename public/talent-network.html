<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Network — TEN Portal</title>
<link rel="stylesheet" href="ten-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base:#05070e; --bg-surface:#090d1a; --bg-card:#0e1428;
  --border:rgba(212,175,55,0.08); --border-strong:rgba(212,175,55,0.18);
  --accent-gold:#D4AF37; --text-primary:#F0EEE8; --text-secondary:#9a9080;
  --accent-green:#10b981; --accent-blue:#3b82f6; --accent-cyan:#06b6d4;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:24px;}
body::before{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.06),transparent 70%);pointer-events:none;}
.top-bar{display:flex;align-items:center;gap:16px;margin-bottom:32px;}
.back-btn{background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-primary);padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none;transition:.2s;}
.back-btn:hover{border-color:var(--accent-gold);color:var(--accent-gold);}
.hero{text-align:center;padding:60px 24px 40px;}
.hero-badge{display:inline-block;padding:6px 16px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.2);border-radius:20px;font-size:13px;color:var(--accent-gold);margin-bottom:16px;}
.hero h1{font-size:42px;font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#F0EEE8,var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:var(--text-secondary);font-size:17px;max-width:560px;margin:0 auto 32px;}
.search-bar{max-width:600px;margin:0 auto;display:flex;gap:12px;}
.search-bar input{flex:1;background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-primary);padding:14px 20px;border-radius:12px;font-size:15px;outline:none;}
.search-bar input:focus{border-color:var(--accent-gold);}
.search-bar button{padding:14px 24px;background:var(--accent-gold);color:#05070e;border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:.2s;}
.search-bar button:hover{opacity:.9;}
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0;}
.filter-chip{padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:.2s;}
.filter-chip:hover,.filter-chip.active{border-color:var(--accent-gold);color:var(--accent-gold);background:rgba(212,175,55,.05);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;}
.talent-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:.2s;cursor:pointer;}
.talent-card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.3);}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent-gold),#b8962e);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#05070e;margin-bottom:12px;}
.talent-name{font-size:17px;font-weight:700;margin-bottom:4px;}
.talent-domain{font-size:13px;color:var(--accent-gold);margin-bottom:8px;}
.talent-bio{font-size:13px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.skill-tag{padding:3px 10px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:12px;font-size:11px;color:#3b82f6;}
.connect-btn{width:100%;padding:9px;background:transparent;border:1px solid var(--border-strong);color:var(--text-primary);border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;}
.connect-btn:hover{background:var(--accent-gold);border-color:var(--accent-gold);color:#05070e;}
.stats{display:flex;gap:16px;margin-bottom:16px;}
.stat{text-align:center;}
.stat-val{font-size:18px;font-weight:700;color:var(--accent-gold);}
.stat-label{font-size:11px;color:var(--text-secondary);}
.loading{text-align:center;padding:80px;color:var(--text-secondary);}
</style>
</head>
<body>
<div class="top-bar">
  <a href="student-dashboard.html" class="back-btn">← Back</a>
</div>

<div class="hero">
  <div class="hero-badge">🌐 TEN Talent Network</div>
  <h1>Connect With Top Talent</h1>
  <p>Discover talented interns, mentors, and professionals across all domains in the TEN ecosystem.</p>
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Search by name, domain, or skill...">
    <button onclick="search()">Search</button>
  </div>
</div>

<div class="filters">
  <div class="filter-chip active" onclick="filterDomain('all', this)">All Domains</div>
  <div class="filter-chip" onclick="filterDomain('MERN Stack Development', this)">MERN Stack</div>
  <div class="filter-chip" onclick="filterDomain('Artificial Intelligence', this)">AI</div>
  <div class="filter-chip" onclick="filterDomain('Data Science', this)">Data Science</div>
  <div class="filter-chip" onclick="filterDomain('Python Development', this)">Python</div>
  <div class="filter-chip" onclick="filterDomain('Web Development', this)">Web Dev</div>
  <div class="filter-chip" onclick="filterDomain('Cyber Security', this)">Cyber Security</div>
</div>

<div id="grid" class="grid"><div class="loading">Loading talent profiles...</div></div>

<script>
let allStudents = [];
let activeFilter = 'all';

const DOMAIN_COLORS = {
  'MERN Stack Development':'#10b981','Artificial Intelligence':'#8b5cf6',
  'Data Science':'#3b82f6','Python Development':'#f59e0b',
  'Web Development':'#06b6d4','Cyber Security':'#ef4444',
  'DevOps with AWS':'#f97316','Java Development':'#eab308',
  'Flutter Development':'#ec4899','Software Engineering':'#6366f1',
  'HR Management':'#14b8a6','Venture Capital':'#D4AF37'
};

const DOMAIN_SKILLS = {
  'MERN Stack Development':['React','Node.js','MongoDB','Express'],
  'Artificial Intelligence':['Machine Learning','Python','TensorFlow','NLP'],
  'Data Science':['Python','Pandas','SQL','Visualization'],
  'Web Development':['HTML/CSS','JavaScript','React','UI/UX'],
  'Python Development':['Python','Django','Flask','Automation'],
  'Cyber Security':['Ethical Hacking','Network Security','OSINT','Pen Testing'],
  'DevOps with AWS':['AWS','Docker','CI/CD','Kubernetes'],
  'Java Development':['Java','Spring Boot','Maven','OOP'],
  'Flutter Development':['Flutter','Dart','Mobile UI','Firebase'],
  'Software Engineering':['System Design','Algorithms','API Design','Testing'],
  'HR Management':['Talent Acquisition','HR Analytics','Compliance','L&D'],
  'Venture Capital':['Investment Analysis','Startup Evaluation','Finance','Due Diligence']
};

async function loadStudents() {
  try {
    const res = await fetch('/api/talent-network/profiles');
    const data = await res.json();
    allStudents = (Array.isArray(data) ? data : (data.students || [])).filter(s => s.employeeId);
    render(allStudents);
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loading">Failed to load. Please try again.</div>';
  }
}

function render(students) {
  if (!students.length) {
    document.getElementById('grid').innerHTML = '<div class="loading">No talent found matching your search.</div>';
    return;
  }
  const html = students.slice(0,24).map(s => {
    const name = s.name || `${s.firstName||''} ${s.lastName||''}`.trim() || 'Intern';
    const initials = name.split(' ').map(n=>n[0]||'').join('').slice(0,2).toUpperCase() || '?';
    const skills = (DOMAIN_SKILLS[s.domain] || ['Problem Solving','Teamwork']).slice(0,3);
    const color = DOMAIN_COLORS[s.domain] || '#D4AF37';
    return `
    <div class="talent-card" onclick="viewProfile('${s.employeeId}')">
      <div class="avatar" style="background:linear-gradient(135deg,${color},${color}99)">${initials}</div>
      <div class="talent-name">${name}</div>
      <div class="talent-domain" style="color:${color}">${s.domain || 'Intern'}</div>
      <div class="talent-bio">${s.tenure||''} internship at The Entrepreneurship Network. Passionate about ${s.domain||'technology'}.</div>
      <div class="skills">${skills.map(sk=>`<span class="skill-tag" style="color:${color};background:${color}15;border-color:${color}30">${sk}</span>`).join('')}</div>
      <div class="stats">
        <div class="stat"><div class="stat-val">${s.employeeId||'-'}</div><div class="stat-label">ID</div></div>
        <div class="stat"><div class="stat-val">${s.tenure||'N/A'}</div><div class="stat-label">Duration</div></div>
      </div>
      <button class="connect-btn">View Profile</button>
    </div>`;
  }).join('');
  document.getElementById('grid').innerHTML = html;
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allStudents.filter(s =>
    (s.name||'').toLowerCase().includes(q) ||
    (s.domain||'').toLowerCase().includes(q) ||
    (s.employeeId||'').toLowerCase().includes(q)
  );
  render(activeFilter === 'all' ? filtered : filtered.filter(s => s.domain === activeFilter));
}

function filterDomain(domain, el) {
  activeFilter = domain;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const filtered = domain === 'all' ? allStudents : allStudents.filter(s => s.domain === domain);
  render(filtered);
}

function viewProfile(empId) {
  window.location.href = 'student-dashboard.html?empId=' + empId;
}

document.getElementById('searchInput').addEventListener('keyup', e => { if(e.key==='Enter') search(); });
loadStudents();
</script>
</body>
</html>
