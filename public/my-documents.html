<!DOCTYPE html>
<!-- NEW FEATURE: Student Document Upload Page -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Documents — TEN Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070e;--surface:#090d1a;--card:#0e1428;
  --gold:#D4AF37;--gold2:#b8952e;
  --text:#F0EEE8;--muted:#9a9080;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --border:rgba(212,175,55,0.1);--border-strong:rgba(212,175,55,0.25);
  --radius:16px;
}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:0;}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 32px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.back-btn{background:rgba(212,175,55,0.08);border:1px solid var(--border-strong);border-radius:10px;color:var(--gold);padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{background:rgba(212,175,55,0.15);}
.topbar-title{font-size:18px;font-weight:800;flex:1;}
.topbar-title span{color:var(--gold);}
.container{max-width:860px;margin:0 auto;padding:32px 24px;}

/* Status banner */
.status-banner{border-radius:14px;padding:18px 24px;margin-bottom:28px;display:flex;align-items:center;gap:16px;font-size:14px;font-weight:600;}
.status-banner.not-uploaded{background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.2);color:var(--muted);}
.status-banner.pending{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);color:var(--amber);}
.status-banner.under_review{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.25);color:var(--blue);}
.status-banner.approved{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);color:var(--green);}
.status-banner.rejected{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:var(--red);}
.status-icon{font-size:24px;flex-shrink:0;}
.status-msg{flex:1;}
.status-msg .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:3px;}
.status-msg .desc{font-size:14px;font-weight:500;}

/* Upload grid */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
@media(max-width:600px){.upload-grid{grid-template-columns:1fr;}}

.upload-zone{background:var(--card);border:2px dashed var(--border-strong);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all 0.25s;position:relative;}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--gold);background:rgba(212,175,55,0.04);}
.upload-zone.has-file{border-style:solid;border-color:var(--green);}
.zone-icon{font-size:36px;margin-bottom:12px;}
.zone-label{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}
.zone-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.zone-accepted{display:inline-block;padding:3px 10px;background:rgba(212,175,55,0.08);border:1px solid var(--border);border-radius:99px;font-size:11px;color:var(--muted);margin-bottom:14px;}
.zone-btn{padding:9px 20px;background:rgba(212,175,55,0.1);border:1px solid var(--border-strong);border-radius:10px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.zone-btn:hover{background:rgba(212,175,55,0.2);}
.file-input{display:none;}

.file-preview{margin-top:16px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.file-preview-icon{font-size:22px;}
.file-preview-info{flex:1;text-align:left;}
.file-preview-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.file-preview-size{font-size:11px;color:var(--muted);}
.file-preview-status{font-size:11px;color:var(--green);font-weight:700;}
.remove-file{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:var(--red);padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;}

/* Upload progress */
.upload-progress{margin-top:10px;display:none;}
.upload-bar-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;}
.upload-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;width:0;transition:width 0.4s ease;}
.upload-zone.locked{opacity:0.7;cursor:not-allowed;}
.upload-zone.locked:hover{border-color:var(--border-strong);background:var(--card);}

/* Submit section */
.submit-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.submit-info{font-size:13px;color:var(--muted);}
.submit-info strong{color:var(--text);}
.submit-btn{padding:14px 32px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;color:#0a0600;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.2s;opacity:0.4;pointer-events:none;}
.submit-btn.ready{opacity:1;pointer-events:auto;}
.submit-btn.ready:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,55,0.3);}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="student-dashboard.html">← Back to Dashboard</a>
  <div class="topbar-title">📋 <span>My Documents</span></div>
</div>

<div class="container">

  <!-- Status Banner -->
  <div class="status-banner not-uploaded" id="statusBanner">
    <div class="status-icon" id="statusIcon">📋</div>
    <div class="status-msg">
      <div class="label" id="statusLabel">Status</div>
      <div class="desc"  id="statusDesc">Loading your document status...</div>
    </div>
  </div>

  <!-- Upload Grid -->
  <div class="upload-grid" id="uploadGrid">

    <!-- Zone 1: Address Proof -->
    <div class="upload-zone" id="zone-address" ondragover="handleDragOver(event,'address')" ondragleave="handleDragLeave(event,'address')" ondrop="handleDrop(event,'address')">
      <input type="file" id="file-address" class="file-input" accept=".jpg,.jpeg,.png,.pdf" onchange="handleFileSelect('address',this)">
      <div class="zone-icon">🪪</div>
      <div class="zone-label">Address Proof</div>
      <div class="zone-sub">Aadhaar Card, Passport, Voter ID,<br>or any government-issued ID</div>
      <div class="zone-accepted">JPG · PNG · PDF · Max 5MB</div>
      <button class="zone-btn" onclick="document.getElementById('file-address').click()">📁 Choose File</button>
      <div class="upload-progress" id="progress-address">
        <div class="upload-bar-wrap"><div class="upload-bar" id="bar-address"></div></div>
      </div>
      <div id="preview-address" style="display:none;"></div>
    </div>

    <!-- Zone 2: Marksheet -->
    <div class="upload-zone" id="zone-marksheet" ondragover="handleDragOver(event,'marksheet')" ondragleave="handleDragLeave(event,'marksheet')" ondrop="handleDrop(event,'marksheet')">
      <input type="file" id="file-marksheet" class="file-input" accept=".jpg,.jpeg,.png,.pdf" onchange="handleFileSelect('marksheet',this)">
      <div class="zone-icon">📚</div>
      <div class="zone-label">Latest College Marksheet</div>
      <div class="zone-sub">Most recent semester or<br>year marksheet</div>
      <div class="zone-accepted">JPG · PNG · PDF · Max 5MB</div>
      <button class="zone-btn" onclick="document.getElementById('file-marksheet').click()">📁 Choose File</button>
      <div class="upload-progress" id="progress-marksheet">
        <div class="upload-bar-wrap"><div class="upload-bar" id="bar-marksheet"></div></div>
      </div>
      <div id="preview-marksheet" style="display:none;"></div>
    </div>

  </div>

</div>

<script>
const EMP_ID = localStorage.getItem('employeeId') || sessionStorage.getItem('employeeId') || '';

const STATUS_CONFIG = {
  not_uploaded: { cls: 'not-uploaded', icon: '📋', label: 'Not Uploaded', desc: 'Please upload both documents to receive your Offer Letter' },
  pending:      { cls: 'pending',      icon: '⏳', label: 'Under Review', desc: '📋 Documents submitted — Under HR Review' },
  under_review: { cls: 'under_review', icon: '🔍', label: 'Under Review', desc: '🔍 Your documents are being reviewed by HR' },
  approved:     { cls: 'approved',     icon: '✅', label: 'Approved',     desc: '✅ Documents approved — Your Offer Letter has been sent to your email' },
  rejected:     { cls: 'rejected',     icon: '❌', label: 'Rejected',     desc: '❌ Document rejected — please re-upload corrected files' }
};

let currentStatus = 'not_uploaded';
let uploaded = { address: false, marksheet: false };
let locked = false; // lock uploads when pending/under_review/approved

async function loadStatus() {
  if (!EMP_ID) { showBanner('not_uploaded', ''); return; }
  try {
    const r = await fetch('/api/v2/documents/my-status', { headers: { 'x-employee-id': EMP_ID } });
    const d = await r.json();
    if (!d.success) return;
    currentStatus = d.status;
    const cfg = STATUS_CONFIG[d.status] || STATUS_CONFIG['not_uploaded'];
    let desc = cfg.desc;
    if (d.status === 'rejected' && d.rejectionReason) desc += `<br><small style="opacity:0.8">Reason: ${d.rejectionReason}</small>`;
    showBanner(d.status, desc);

    // If already uploaded — show existing files
    if (d.addressProofUrl) markExistingFile('address', d.addressProofUrl);
    if (d.marksheetUrl)    markExistingFile('marksheet', d.marksheetUrl);

    // Lock if not allowed to re-upload
    locked = ['pending', 'under_review', 'approved'].includes(d.status);
    if (locked) lockZones();
  } catch(e) { console.error(e); }
}

function showBanner(status, desc) {
  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG['not_uploaded'];
  const banner = document.getElementById('statusBanner');
  banner.className = 'status-banner ' + cfg.cls;
  document.getElementById('statusIcon').textContent  = cfg.icon;
  document.getElementById('statusLabel').textContent = cfg.label;
  document.getElementById('statusDesc').innerHTML    = desc || cfg.desc;
}

function markExistingFile(type, url) {
  uploaded[type] = true;
  const zone = document.getElementById('zone-' + type);
  zone.classList.add('has-file');
  const fname = url.split('/').pop();
  showFilePreview(type, fname, null, true);
}

function handleDragOver(e, type) {
  e.preventDefault();
  if (!locked) document.getElementById('zone-' + type).classList.add('drag-over');
}
function handleDragLeave(e, type) {
  document.getElementById('zone-' + type).classList.remove('drag-over');
}
function handleDrop(e, type) {
  e.preventDefault();
  document.getElementById('zone-' + type).classList.remove('drag-over');
  if (locked) return;
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(type, file);
}
function handleFileSelect(type, input) {
  if (input.files[0]) uploadFile(type, input.files[0]);
}

function lockZones() {
  locked = true;
  ['address', 'marksheet'].forEach(type => {
    const zone = document.getElementById('zone-' + type);
    zone.classList.add('locked');
    const btn = zone.querySelector('.zone-btn');
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '0.4';
      btn.style.cursor = 'not-allowed';
    }
    const input = document.getElementById('file-' + type);
    if (input) input.disabled = true;
  });
  document.querySelectorAll('.remove-file').forEach(b => b.remove());
}

async function uploadFile(type, file) {
  // Validate size
  if (file.size > 5 * 1024 * 1024) {
    return Swal.fire({ icon: 'error', title: 'File too large', text: 'Maximum file size is 5MB', background: '#0e1428', color: '#F0EEE8' });
  }
  const endpoint = type === 'address' ? '/api/v2/documents/upload-address-proof' : '/api/v2/documents/upload-marksheet';
  const formData = new FormData();
  formData.append('file', file);
  formData.append('employeeId', EMP_ID);

  // Show progress
  document.getElementById('progress-' + type).style.display = 'block';
  animateBar(type);

  try {
    const r = await fetch(endpoint, { method: 'POST', headers: { 'x-employee-id': EMP_ID }, body: formData });
    let d;
    try {
      d = await r.json();
    } catch (_) {
      d = { success: false, message: `Server error (HTTP ${r.status}). Please try again.` };
    }
    document.getElementById('progress-' + type).style.display = 'none';
    document.getElementById('bar-' + type).style.width = '0';
    if (d.success) {
      uploaded[type] = true;
      document.getElementById('zone-' + type).classList.add('has-file');
      showFilePreview(type, file.name, file.size);
      if (d.autoSubmitted || d.uploadStatus === 'pending') {
        currentStatus = 'pending';
        showBanner('pending', '✅ Documents submitted — HR will review them shortly');
        lockZones();
        Swal.fire({
          icon: 'success',
          title: '✅ Documents Submitted!',
          text: 'Both documents uploaded and sent to HR for review.',
          background: '#0e1428',
          color: '#F0EEE8',
          confirmButtonColor: '#D4AF37'
        });
      } else {
        const otherLabel = type === 'address' ? 'College Marksheet' : 'Address Proof';
        Swal.fire({
          icon: 'success',
          title: 'Uploaded!',
          text: `Now upload your ${otherLabel} to complete submission.`,
          background: '#0e1428',
          color: '#F0EEE8',
          confirmButtonColor: '#D4AF37',
          timer: 3000,
          timerProgressBar: true,
          showConfirmButton: false
        });
      }
    } else {
      Swal.fire({ icon: 'error', title: 'Upload failed', text: d.message, background: '#0e1428', color: '#F0EEE8' });
    }
  } catch(e) {
    document.getElementById('progress-' + type).style.display = 'none';
    Swal.fire({ icon: 'error', title: 'Upload failed', text: 'Could not reach the server. Check your connection and try again.', background: '#0e1428', color: '#F0EEE8' });
  }
}

function animateBar(type) {
  let w = 0;
  const bar = document.getElementById('bar-' + type);
  const iv = setInterval(() => {
    w += 8 + Math.random() * 12;
    if (w >= 85) { clearInterval(iv); return; }
    bar.style.width = w + '%';
  }, 180);
}

function showFilePreview(type, name, size, existing) {
  const el = document.getElementById('preview-' + type);
  const sizeStr = size ? (size > 1024 * 1024 ? (size / 1024 / 1024).toFixed(1) + ' MB' : Math.round(size / 1024) + ' KB') : '';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="file-preview">
      <div class="file-preview-icon">${name.endsWith('.pdf') ? '📄' : '🖼️'}</div>
      <div class="file-preview-info">
        <div class="file-preview-name">${name}</div>
        ${sizeStr ? `<div class="file-preview-size">${sizeStr}</div>` : ''}
        <div class="file-preview-status">✓ ${existing ? 'Previously uploaded' : 'Uploaded'}</div>
      </div>
      ${!locked ? `<button class="remove-file" onclick="removeFile('${type}')">✕</button>` : ''}
    </div>`;
}

function removeFile(type) {
  uploaded[type] = false;
  document.getElementById('zone-' + type).classList.remove('has-file');
  document.getElementById('preview-' + type).style.display = 'none';
  document.getElementById('preview-' + type).innerHTML = '';
  document.getElementById('file-' + type).value = '';
}

// Init
loadStatus();
</script>
</body>
</html>
