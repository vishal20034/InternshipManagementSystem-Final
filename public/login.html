<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — Student Login</title>
<link rel="stylesheet" href="ten-theme.css">
<link rel="stylesheet" href="ten-motion.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>

html, body {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.login-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 440px;
  padding: 24px;
  animation: ten-fadeUp 0.6s ease both;
}

/* ── Brand header ── */
.brand-header {
  text-align: center;
  margin-bottom: 32px;
}
.brand-logo-ring {
  width: 72px; height: 72px;
  background: rgba(212,175,55,0.08);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(212,175,55,0.35);
  border-radius: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 0 40px rgba(212,175,55,0.25), inset 0 1px 1px rgba(255,255,255,0.1);
  animation: ten-pulse-gold 3s ease infinite;
  transition: all 0.3s ease;
}
.brand-logo-ring:hover {
  background: rgba(212,175,55,0.12);
  border-color: rgba(212,175,55,0.5);
  box-shadow: 0 0 60px rgba(212,175,55,0.35), inset 0 1px 1px rgba(255,255,255,0.15);
  transform: translateY(-2px);
}
.brand-name {
  font-family: var(--ten-font-display);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--ten-gold);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.brand-full {
  font-size: 11px;
  color: var(--ten-text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── Card ── */
.login-card {
  background: var(--ten-card);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-xl);
  padding: 36px 38px;
  box-shadow: var(--ten-shadow-lg), var(--ten-glow-gold);
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ten-gold), transparent);
}

.card-title {
  font-family: var(--ten-font-display);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.card-sub {
  font-size: 14px;
  color: var(--ten-text-sub);
  margin-bottom: 30px;
  line-height: 1.6;
}

.field-group {
  margin-bottom: 20px;
}
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ten-text-sub);
  margin-bottom: 9px;
}
.field-input {
  width: 100%;
  padding: 14px 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-sm);
  color: var(--ten-text);
  font-family: var(--ten-font-body);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field-input:focus {
  border-color: var(--ten-gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,0.10);
}
.field-input::placeholder { color: #2e2820; }

.login-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--ten-gold), var(--ten-gold-dim));
  border: none;
  border-radius: var(--ten-r-sm);
  color: #0a0700;
  font-family: var(--ten-font-display);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 6px;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(212,175,55,0.4);
}
.login-btn:active { transform: translateY(0); }

.loading-text {
  display: none;
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--ten-gold);
  font-family: var(--ten-font-mono);
  letter-spacing: 1px;
}

/* ── Footer nav ── */
.card-nav {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.card-nav a {
  font-size: 12px;
  color: var(--ten-text-muted);
  text-decoration: none;
  letter-spacing: 0.5px;
  transition: color 0.2s;
  padding: 4px 0;
}
.card-nav a:hover { color: var(--ten-gold); }
.card-nav .sep { color: var(--ten-text-muted); opacity: 0.3; }

.page-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: var(--ten-text-muted);
  letter-spacing: 0.5px;
}

@media (max-width: 500px) {
  html, body { overflow: auto; height: auto; padding: 20px 0; }
  .login-card { padding: 28px 22px; }
}
</style>
</head>
<body>

<div class="ten-grid-bg"></div>
<div class="ten-orb ten-orb-1"></div>
<div class="ten-orb ten-orb-2"></div>

<div class="login-wrap">

  <div class="brand-header">
    <div class="brand-logo-ring ten-float">
      <img src="ten-logo.png" alt="TEN Logo" style="width:48px;height:48px;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(212,175,55,0.4));" />
    </div>
    <div class="brand-name">TEN</div>
    <div class="brand-full">The Entrepreneurship Network</div>
  </div>

  <div class="login-card ten-animated-border">
    <div class="card-title ten-fade-up ten-d1">Student Login</div>
    <p class="card-sub ten-fade-up ten-d2">Cloud · DevOps · AI · Cyber Security · Web Dev & more</p>

    <form id="loginForm" class="ten-fade-up ten-d3">
      <div class="field-group">
        <label class="field-label">Employee ID</label>
        <input class="field-input" type="text" id="employeeId" placeholder="Enter your Employee ID" required>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button class="login-btn" type="submit">Login to Dashboard</button>
      <div class="loading-text" id="loadingText">⟳ Verifying credentials...</div>
    </form>
  </div>

  <div class="card-nav">
    <a href="register.html">Register</a>
    <span class="sep">·</span>
    <a href="coordinator-login.html">Coordinator Login</a>
    <span class="sep">·</span>
    <a href="index.html">Home</a>
  </div>

<script src="/forgot-password.js"></script>
<script>if(window.TenForgotPassword) TenForgotPassword.init({ role: "student" });</script>

  <div class="page-footer">© 2026 TEN Internship Management System</div>

</div>

<script>
const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("loadingText").style.display = "block";

  const employeeId = document.getElementById("employeeId").value;
  const password = document.getElementById("password").value;

  try {
    const response = await fetch("/student-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employeeId, password })
    });

    const data = await response.json();
    console.log(data.student);
    document.getElementById("loadingText").style.display = "none";

    if (data.success) {
      localStorage.setItem("student", JSON.stringify({
        name: data.student.name || data.student.fullName || data.student.username || data.student.employeeId,
        employeeId: data.student.employeeId,
        domain: data.student.domain
      }));

      Swal.fire({
        icon: "success",
        title: "Login Successful",
        text: "Welcome to TEN Internship Portal 🚀",
        background: "#0e1428",
        color: "#F0EEE8",
        confirmButtonColor: "#D4AF37"
      });

      window.location.href = "student-dashboard.html";
    } else {
      Swal.fire({
        icon: "error",
        title: "Login Failed",
        text: data.message || "Invalid credentials",
        background: "#0e1428",
        color: "#F0EEE8",
        confirmButtonColor: "#ef4444"
      });
    }
  } catch (error) {
    document.getElementById("loadingText").style.display = "none";
    console.log(error);
    Swal.fire({
      icon: "error",
      title: "Server Error",
      text: "Something went wrong. Please try again.",
      background: "#0e1428",
      color: "#F0EEE8",
      confirmButtonColor: "#ef4444"
    });
  }
});
</script>

<script src="ten-motion.js"></script>
</body>
</html>
