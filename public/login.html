<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — Student Login</title>
<link rel="stylesheet" href="ten-theme.css">
<link rel="stylesheet" href="ten-motion.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>

html, body {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.login-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 440px;
  padding: 24px;
  animation: ten-fadeUp 0.6s ease both;
}

/* ── Brand header ── */
.brand-header {
  text-align: center;
  margin-bottom: 32px;
}
.brand-logo-ring {
  width: 72px; height: 72px;
  background: rgba(212,175,55,0.08);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(212,175,55,0.35);
  border-radius: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 0 40px rgba(212,175,55,0.25), inset 0 1px 1px rgba(255,255,255,0.1);
  animation: ten-pulse-gold 3s ease infinite;
  transition: all 0.3s ease;
}
.brand-logo-ring:hover {
  background: rgba(212,175,55,0.12);
  border-color: rgba(212,175,55,0.5);
  box-shadow: 0 0 60px rgba(212,175,55,0.35), inset 0 1px 1px rgba(255,255,255,0.15);
  transform: translateY(-2px);
}
.brand-name {
  font-family: var(--ten-font-display);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--ten-gold);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.brand-full {
  font-size: 11px;
  color: var(--ten-text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── Card ── */
.login-card {
  background: var(--ten-card);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-xl);
  padding: 36px 38px;
  box-shadow: var(--ten-shadow-lg), var(--ten-glow-gold);
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ten-gold), transparent);
}

.card-title {
  font-family: var(--ten-font-display);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.card-sub {
  font-size: 14px;
  color: var(--ten-text-sub);
  margin-bottom: 30px;
  line-height: 1.6;
}

.field-group {
  margin-bottom: 20px;
}
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ten-text-sub);
  margin-bottom: 9px;
}
.field-input {
  width: 100%;
  padding: 14px 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-sm);
  color: var(--ten-text);
  font-family: var(--ten-font-body);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field-input:focus {
  border-color: var(--ten-gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,0.10);
}
.field-input::placeholder { color: #2e2820; }

.login-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--ten-gold), var(--ten-gold-dim));
  border: none;
  border-radius: var(--ten-r-sm);
  color: #0a0700;
  font-family: var(--ten-font-display);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 6px;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(212,175,55,0.4);
}
.login-btn:active { transform: translateY(0); }

.loading-text {
  display: none;
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--ten-gold);
  font-family: var(--ten-font-mono);
  letter-spacing: 1px;
}

/* ── Footer nav ── */
.card-nav {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.card-nav a {
  font-size: 12px;
  color: var(--ten-text-muted);
  text-decoration: none;
  letter-spacing: 0.5px;
  transition: color 0.2s;
  padding: 4px 0;
}
.card-nav a:hover { color: var(--ten-gold); }
.card-nav .sep { color: var(--ten-text-muted); opacity: 0.3; }

.page-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: var(--ten-text-muted);
  letter-spacing: 0.5px;
}

@media (max-width: 500px) {
  html, body { overflow: auto; height: auto; padding: 20px 0; }
  .login-card { padding: 28px 22px; }
}
</style>
</head>
<body>

<div class="ten-grid-bg"></div>
<div class="ten-orb ten-orb-1"></div>
<div class="ten-orb ten-orb-2"></div>

<div class="login-wrap">

  <div class="brand-header">
    <div class="brand-logo-ring ten-float">
      <img src="ten-logo.png" alt="TEN Logo" class="ten-logo-blend" style="width:48px;height:48px;display:block;" />
    </div>
    <div class="brand-name">TEN ECOSYSTEM</div>
    <div class="brand-full">Unified Ecosystem Control Center</div>
  </div>

  <div class="login-card ten-animated-border">
    <div class="card-title ten-fade-up ten-d1">Sign In</div>
    <p class="card-sub ten-fade-up ten-d2">Access Students, Founders, Mentors, Investors, and Contractors hubs</p>

    <!-- Role Selection Switcher -->
    <div style="display:flex; justify-content:space-between; gap:4px; margin-bottom:24px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); padding:4px; border-radius:10px;">
        <button type="button" class="role-tab" id="tab-student" onclick="setLoginRole('student')" style="flex:1; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase; border:none; background:rgba(212,175,55,0.08); color:var(--ten-gold); border-radius:6px; cursor:pointer; transition:all 0.2s;">Student</button>
        <button type="button" class="role-tab" id="tab-founder" onclick="setLoginRole('founder')" style="flex:1; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase; border:none; background:none; color:#94a3b8; border-radius:6px; cursor:pointer; transition:all 0.2s;">Founder</button>
        <button type="button" class="role-tab" id="tab-mentor" onclick="setLoginRole('mentor')" style="flex:1; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase; border:none; background:none; color:#94a3b8; border-radius:6px; cursor:pointer; transition:all 0.2s;">Mentor</button>
        <button type="button" class="role-tab" id="tab-investor" onclick="setLoginRole('investor')" style="flex:1; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase; border:none; background:none; color:#94a3b8; border-radius:6px; cursor:pointer; transition:all 0.2s;">Investor</button>
        <button type="button" class="role-tab" id="tab-contractor" onclick="setLoginRole('contractor')" style="flex:1; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase; border:none; background:none; color:#94a3b8; border-radius:6px; cursor:pointer; transition:all 0.2s;">Contractor</button>
    </div>

    <form id="loginForm" class="ten-fade-up ten-d3">
      <div class="field-group">
        <label class="field-label" id="fieldLabel">Email Address or Employee ID</label>
        <input class="field-input" type="text" id="loginId" placeholder="Enter your Email or Employee ID" required>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button class="login-btn" type="submit">Sign In to Dashboard</button>
      <div class="loading-text" id="loadingText">⟳ Authenticating and loading dashboard...</div>
    </form>
  </div>

  <div class="card-nav">
    <a href="index.html">Register Account</a>
    <span class="sep">·</span>
    <a href="coordinator-login.html">Coordinator Login</a>
    <span class="sep">·</span>
    <a href="index.html">Home</a>
  </div>

<script src="/forgot-password.js"></script>
<script>
let activeRole = 'student';

function setLoginRole(role) {
  activeRole = role;
  document.querySelectorAll('.role-tab').forEach(b => {
    b.style.color = '#94a3b8';
    b.style.background = 'none';
  });
  const activeBtn = document.getElementById('tab-' + role);
  if (activeBtn) {
    activeBtn.style.color = 'var(--ten-gold)';
    activeBtn.style.background = 'rgba(212,175,55,0.08)';
  }
  
  const fieldLabel = document.getElementById('fieldLabel');
  const loginIdInput = document.getElementById('loginId');
  if (role === 'student') {
    fieldLabel.textContent = 'Email Address or Employee ID';
    loginIdInput.placeholder = 'Enter your Email or Employee ID';
  } else {
    fieldLabel.textContent = role.toUpperCase() + ' Email Address';
    loginIdInput.placeholder = 'Enter your ' + role.toUpperCase() + ' Email';
  }
  if (window.TenForgotPassword) {
    TenForgotPassword.init({ role: role });
  }
}
</script>
<script>if(window.TenForgotPassword) TenForgotPassword.init({ role: "student" });</script>

  <div class="page-footer">© 2026 TEN Internship Management System</div>

</div>

<script>
const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("loadingText").style.display = "block";

  const loginIdInput = document.getElementById("loginId").value.trim();
  const password = document.getElementById("password").value;

  try {
    const isEmail = loginIdInput.includes("@");
    const payload = isEmail ? { email: loginIdInput, password } : { employeeId: loginIdInput, password };

    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    document.getElementById("loadingText").style.display = "none";

    if (data.success) {
      const activeRole = data.role || "student";
      localStorage.setItem("role", activeRole);

      if (data.user) {
        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("userId", data.user._id);
      }

      if (data.student) {
        localStorage.setItem("employeeId", data.student.employeeId);
        localStorage.setItem("student", JSON.stringify(data.student));
        localStorage.setItem("ten_token", data.student.employeeId);
        localStorage.setItem("ten_employee_id", data.student.employeeId);
      }

      Swal.fire({
        icon: "success",
        title: "Login Successful",
        text: `Welcome inside the TEN ${activeRole.toUpperCase()} workspace! 🚀`,
        background: "#0e1428",
        color: "#F0EEE8",
        confirmButtonColor: "#D4AF37",
        timer: 1500,
        showConfirmButton: false
      });

      setTimeout(() => {
        // Dynamic Role-Based Login Redirects
        if (activeRole === "student") {
          window.location.href = "student-dashboard.html";
        } else if (activeRole === "founder") {
          window.location.href = "founder-os.html";
        } else if (activeRole === "mentor") {
          window.location.href = "mentor-dashboard.html";
        } else if (activeRole === "investor") {
          window.location.href = "investor-dashboard.html";
        } else if (activeRole === "contractor") {
          window.location.href = "contractor-dashboard.html";
        } else if (activeRole === "hr" || activeRole === "admin") {
          window.location.href = "hr-portal.html";
        } else {
          window.location.href = "student-dashboard.html";
        }
      }, 1500);

    } else {
      Swal.fire({
        icon: "error",
        title: "Login Failed",
        text: data.message || "Invalid credentials",
        background: "#0e1428",
        color: "#F0EEE8",
        confirmButtonColor: "#ef4444"
      });
    }
  } catch (error) {
    document.getElementById("loadingText").style.display = "none";
    console.error(error);
    Swal.fire({
      icon: "error",
      title: "Server Error",
      text: "Something went wrong. Please try again.",
      background: "#0e1428",
      color: "#F0EEE8",
      confirmButtonColor: "#ef4444"
    });
  }
});
</script>

<script src="ten-motion.js"></script>
</body>
</html>
